

services:
  web:
    build: .
    container_name: clinic_appointment_backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    # command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis   # 🔥 ADD THIS
    env_file:
      - .env

  db:
    image: postgres:15
    container_name: clinic_appointment_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:   # 🔥 NEW SERVICE
    image: redis:7
    container_name: clinic_appointment_redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - web    
    env_file:
    - .env  

volumes:
  postgres_data: